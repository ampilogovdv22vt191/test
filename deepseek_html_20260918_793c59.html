<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completed Tasks Test</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

  <style>
    body {
      background: #f8f9fa;
      padding: 2rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .completed-table-wrapper {
      background: white;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      margin: 1rem 0;
    }

    .selection-controls {
      background: white;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e9ecef;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .selection-controls.show { display: flex; }
    .selection-info { display: flex; align-items: center; gap: 1rem; flex: 1; }
    .selection-actions { display: flex; gap: 0.5rem; }

    .completed-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .completed-table thead th {
      background: #f8f9fa;
      color: #2c3e50;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.9rem 1rem;
      border-bottom: 2px solid #e9ecef;
      text-align: left;
      white-space: nowrap;
    }

    .completed-table tbody tr {
      transition: all 0.15s ease;
      border-bottom: 1px solid #f1f3f5;
      cursor: pointer;
    }
    .completed-table tbody tr:hover { background: rgba(67, 97, 238, 0.04); }

    .completed-table tbody tr.status-success {
      border-left: 4px solid #198754;
      background: rgba(25, 135, 84, 0.02);
    }
    .completed-table tbody tr.status-success:hover { background: rgba(25, 135, 84, 0.06); }

    .completed-table tbody tr.status-failed {
      border-left: 4px solid #dc3545;
      background: rgba(220, 53, 69, 0.02);
    }
    .completed-table tbody tr.status-failed:hover { background: rgba(220, 53, 69, 0.06); }

    .completed-table tbody tr.selected {
      background: rgba(67, 97, 238, 0.12) !important;
      box-shadow: inset 0 0 0 2px rgba(67, 97, 238, 0.3);
    }
    .completed-table tbody tr.selected td { color: #2c3e50; }
    .completed-table tbody tr.selected:hover { background: rgba(67, 97, 238, 0.18) !important; }

    .completed-table tbody td {
      padding: 0.85rem 1rem;
      vertical-align: middle;
      color: #2c3e50;
    }

    .completed-table .form-check-input {
      cursor: pointer;
      margin: 0;
      width: 1.2em;
      height: 1.2em;
      border: 2px solid #adb5bd;
      transition: all 0.15s ease;
    }
    .completed-table .form-check-input:checked {
      background-color: #4361ee;
      border-color: #4361ee;
    }
    .completed-table .form-check-input:focus {
      box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25);
      border-color: #4361ee;
    }

    .file-name-cell {
      font-weight: 500;
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .details-cell { max-width: 300px; }
    .details-success { color: #6c757d; }
    .details-failed { color: #dc3545; font-weight: 500; }

    /* ================================================================
       ===== НОВОЕ: Стили для ячейки архитектуры =====
       ================================================================ */
    .architecture-cell {
      max-width: 200px;
    }
    .architecture-value {
      font-weight: 500;
      color: #2c3e50;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .architecture-detected {
      color: #0d6efd;
      cursor: help;
    }
    .architecture-detected-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(13, 110, 253, 0.15);
      color: #0d6efd;
      font-size: 0.7rem;
    }
    /* ================================================================
       ===== КОНЕЦ НОВЫХ СТИЛЕЙ АРХИТЕКТУРЫ =====
       ================================================================ */

    .flags-cell {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .flag-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }
    .flag-icon.auto {
      background: rgba(13, 110, 253, 0.1);
      color: #0d6efd;
    }
    .flag-icon.manual {
      background: rgba(108, 117, 125, 0.1);
      color: #6c757d;
    }
    .flag-icon.other {
      background: rgba(111, 66, 193, 0.1);
      color: #6f42c1;
      cursor: pointer;
    }
    .flag-icon.other:hover {
      background: rgba(111, 66, 193, 0.2);
      transform: scale(1.1);
    }

    /* ================================================================
       ===== НОВОЕ: Иконка комментария =====
       ================================================================ */
    .flag-icon.comments {
      background: rgba(255, 193, 7, 0.15);
      color: #d39e00;
      cursor: help;
    }
    .flag-icon.comments:hover {
      background: rgba(255, 193, 7, 0.25);
      transform: scale(1.1);
    }
    /* ================================================================
       ===== КОНЕЦ НОВЫХ СТИЛЕЙ КОММЕНТАРИЯ =====
       ================================================================ */

    .time-cell {
      white-space: nowrap;
      color: #6c757d;
      font-size: 0.85rem;
    }

    .empty-value { color: #adb5bd; }

    .json-wrapper {
      background: #1e1e1e;
      border-radius: 0.5rem;
      padding: 1rem;
      max-height: 70vh;
      overflow-y: auto;
    }
    .json-content {
      color: #d4d4d4;
      margin: 0;
      font-size: 0.85rem;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .error-tooltip {
      position: fixed;
      z-index: 9999;
      background: #1e1e1e;
      color: #f8f8f8;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      font-size: 0.8rem;
      max-width: 500px;
      pointer-events: auto;
      display: none;
    }
    .error-tooltip.show { display: block; }
    .error-tooltip .tooltip-row { margin-bottom: 0.5rem; }
    .error-tooltip .tooltip-row:last-child { margin-bottom: 0; }
    .error-tooltip .tooltip-label {
      color: #9cdcfe;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.15rem;
    }
    .error-tooltip .tooltip-value {
      color: #ce9178;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error-tooltip .tooltip-value.traceback {
      color: #d4d4d4;
      font-size: 0.75rem;
      max-height: 200px;
      overflow-y: auto;
      background: #2d2d2d;
      padding: 0.5rem;
      border-radius: 0.25rem;
      margin-top: 0.25rem;
    }

    /* ================================================================
       ===== НОВОЕ: Стили для tooltip архитектуры =====
       ================================================================ */
    .error-tooltip .tooltip-scores-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-top: 0.25rem;
    }
    .error-tooltip .tooltip-score-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: #ce9178;
      font-family: 'Courier New', monospace;
    }
    .error-tooltip .tooltip-tag {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: rgba(13, 110, 253, 0.2);
      color: #9cdcfe;
      border-radius: 0.25rem;
      font-size: 0.7rem;
      margin: 0.15rem 0.15rem 0 0;
      font-family: 'Courier New', monospace;
    }
    /* ================================================================
       ===== КОНЕЦ НОВЫХ СТИЛЕЙ TOOLTIP АРХИТЕКТУРЫ =====
       ================================================================ */

    @media (max-width: 768px) {
      .completed-table { font-size: 0.8rem; }
      .completed-table thead th,
      .completed-table tbody td { padding: 0.6rem 0.5rem; }
      .file-name-cell,
      .details-cell,
      .architecture-cell { max-width: 120px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 class="mb-4">Завершенные задачи</h2>

    <div class="completed-table-wrapper">
      <div class="selection-controls" id="selectionControls">
        <div class="selection-info">
          <div>
            <input type="checkbox" class="form-check-input select-all-checkbox" id="selectAllCheckbox">
            <label class="form-check-label fw-medium" for="selectAllCheckbox">
              Выбрать все
            </label>
          </div>
          <span class="text-muted" id="selectedCount">0 объектов выбрано</span>
        </div>
        <div class="selection-actions">
          <button class="btn btn-sm btn-outline-danger" id="deleteSelectedBtn">
            <i class="bi bi-trash"></i> Удалить выбранные
          </button>
          <button class="btn btn-sm btn-outline-secondary" id="clearSelectionBtn">
            <i class="bi bi-x-circle"></i> Очистить
          </button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="completed-table">
          <thead>
            <tr>
              <th style="width: 50px;">
                <input type="checkbox" class="form-check-input" id="selectAllHeader">
              </th>
              <th>Производитель</th>
              <th>Модель</th>
              <th>Версия</th>
              <!-- ===== НОВОЕ: Колонка Архитектура ===== -->
              <th>Архитектура</th>
              <!-- ===== КОНЕЦ НОВОГО ===== -->
              <th>Имя файла</th>
              <th>Детали</th>
              <th style="width: 100px;">Флаги</th>
              <th>Время</th>
            </tr>
          </thead>
          <tbody id="completed-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="otherModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-code-square me-2"></i>Дополнительная информация
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="json-wrapper">
            <pre id="otherJsonContent" class="json-content"></pre>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" id="copyJsonBtn">
            <i class="bi bi-clipboard me-1"></i>Копировать JSON
          </button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ================================================================
    // ===== ЗАХАРДКОЖЕННЫЕ ДАННЫЕ (с новыми полями) =====
    // ================================================================
    const MOCK_COMPLETED_DATA = {
      total_count: 8,
      es_response: [
        // 1. Success + architecture (явная) + comments
        {
          _source: {
            vendor: "Intel", model: "Xeon E5-2680", version: "2.1.0",
            architecture: "x86_64",  // ← явная архитектура
            file_hash: "abc123def456", file_name: "firmware_intel_xeon_v2.1.0.bin",
            status: true, ext_name: "success_handler_v1", is_auto_uploaded: true,
            comments: "Проверено вручную, всё ок",
            timestamp: "2026-09-14T10:30:00Z"
          }
        },
        // 2. Success + detected_architecture (выявленная) + other + comments
        {
          _source: {
            vendor: "AMD", model: "Ryzen 9 5950X", version: "3.0.1",
            detected_architecture: {   // ← выявленная архитектура
              scores: "0.95, 0.87, 0.72",
              likely: "ARMv8-A",
              soc_hits: ["SDM660", "SM8150", "SM8250"]
            },
            file_hash: "def789ghi012", file_name: "firmware_amd_ryzen_v3.0.1.bin",
            status: true, ext_name: "advanced_parser", is_auto_uploaded: false,
            comments: "Обнаружено автоматически",
            other: JSON.stringify({ parser_version: "2.3.1" }, null, 2),
            timestamp: "2026-09-14T09:15:00Z"
          }
        },
        // 3. Failed с ошибкой, без архитектуры
        {
          _source: {
            vendor: "NVIDIA", model: "RTX 4090", version: "1.5.2",
            file_hash: "ghi345jkl678", file_name: "firmware_nvidia_rtx4090_v1.5.2.bin",
            status: false, exc_line: 142, exc_type: "ValueError",
            exc_value: "Invalid firmware signature at offset 0x4F2A",
            exc_traceback: "Traceback (most recent call last):\n  File \"/app/parsers/firmware.py\", line 142\nValueError: Invalid firmware signature",
            is_auto_uploaded: true,
            timestamp: "2026-09-14T08:45:00Z"
          }
        },
        // 4. Failed без деталей, без архитектуры
        {
          _source: {
            vendor: "Qualcomm", model: "Snapdragon 8 Gen 2", version: "4.2.0",
            file_hash: "jkl901mno234", file_name: "firmware_qualcomm_sd8g2_v4.2.0.bin",
            status: false, is_auto_uploaded: false,
            timestamp: "2026-09-14T07:20:00Z"
          }
        },
        // 5. Success + architecture + other + comments
        {
          _source: {
            vendor: "Samsung", model: "Exynos 2200", version: "2.8.5",
            architecture: "ARMv8.2-A",
            file_hash: "mno567pqr890", file_name: "firmware_samsung_exynos_v2.8.5.bin",
            status: true, ext_name: "samsung_parser", is_auto_uploaded: false,
            comments: "Требуется дополнительная проверка",
            other: JSON.stringify({ detected_components: ["bootloader", "kernel"] }, null, 2),
            timestamp: "2026-09-13T22:10:00Z"
          }
        },
        // 6. Failed + detected_architecture + other
        {
          _source: {
            vendor: "Apple", model: "M2 Pro", version: "1.1.0",
            detected_architecture: {
              scores: "0.88, 0.65",
              likely: "ARMv9",
              soc_hits: ["M2", "M2 Pro"]
            },
            file_hash: "pqr123stu456", file_name: "firmware_apple_m2pro_v1.1.0.bin",
            status: false, exc_line: 87, exc_type: "FileNotFoundError",
            exc_value: "Required section 'SEP' not found",
            exc_traceback: "Traceback (most recent call last):\n  File \"/app/parsers/apple.py\", line 87\nFileNotFoundError: Required section 'SEP'",
            is_auto_uploaded: true,
            other: JSON.stringify({ partial_extraction: true }, null, 2),
            timestamp: "2026-09-13T20:05:00Z"
          }
        },
        // 7. Success без архитектуры, но с comments
        {
          _source: {
            vendor: "MediaTek", model: "Dimensity 9200", version: "1.0.0",
            file_hash: "stu789vwx012", file_name: "firmware_mediatek_d9200_v1.0.0.bin",
            status: true, ext_name: "mediatek_handler", is_auto_uploaded: true,
            comments: "Стандартный парсинг прошёл успешно",
            timestamp: "2026-09-13T18:30:00Z"
          }
        },
        // 8. Success + architecture, без comments
        {
          _source: {
            vendor: "Broadcom", model: "BCM2711", version: "5.10.0",
            architecture: "ARMv8-A",
            file_hash: "vwx345yzа678", file_name: "firmware_broadcom_bcm2711_v5.10.0.bin",
            status: true, ext_name: "broadcom_parser", is_auto_uploaded: true,
            timestamp: "2026-09-13T16:20:00Z"
          }
        }
      ]
    };

    // ================================================================
    // ===== СОСТОЯНИЕ =====
    // ================================================================
    let selectedDags = new Set();
    let currentOtherJson = null;
    let tooltipHideTimeout = null;

    // ================================================================
    // ===== ВСПОМОГАТЕЛЬНЫЕ =====
    // ================================================================
    function formatDateTime(dateString) {
      if (!dateString) return 'N/A';
      return new Date(dateString).toLocaleString('ru-RU');
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // ================================================================
    // ===== НОВАЯ ФУНКЦИЯ: Рендеринг ячейки архитектуры =====
    // ===== Логика:
    // =====   - Если есть architecture → показываем его
    // =====   - Иначе если есть detected_architecture → показываем likely + иконка 🔍
    // =====   - Иначе → прочерк
    // ================================================================
    function renderArchitectureCell(source) {
      const { architecture, detected_architecture } = source;

      // Случай 1: явная архитектура
      if (architecture) {
        return `<span class="architecture-value">${escapeHtml(architecture)}</span>`;
      }

      // Случай 2: выявленная архитектура
      if (detected_architecture) {
        const likely = detected_architecture.likely || '—';
        const scores = detected_architecture.scores || '';
        const socHits = detected_architecture.soc_hits || [];

        return `
          <span class="architecture-value architecture-detected architecture-trigger"
                data-arch-likely="${escapeHtml(likely)}"
                data-arch-scores="${escapeHtml(scores)}"
                data-arch-soc-hits="${escapeHtml(JSON.stringify(socHits))}">
            <span class="architecture-detected-icon">
              <i class="bi bi-search"></i>
            </span>
            ${escapeHtml(likely)}
          </span>
        `;
      }

      // Случай 3: нет ничего
      return `<span class="empty-value">—</span>`;
    }
    // ================================================================
    // ===== КОНЕЦ НОВОЙ ФУНКЦИИ =====
    // ================================================================

    // ================================================================
    // ===== РЕНДЕРИНГ =====
    // ================================================================
    function renderCompletedTasks(data, reload = false) {
      const tbody = document.getElementById('completed-tbody');

      if (reload) {
        tbody.innerHTML = '';
        selectedDags.clear();
        toggleSelectionMode();
      }

      if (data.total_count === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" class="text-center py-5 text-muted">
              <i class="bi bi-info-circle fs-3 d-block mb-2"></i>
              Завершенных задач не найдено
            </td>
          </tr>
        `;
        return;
      }

      const dags = data.es_response || [];
      dags.forEach(({ _source }) => {
        const row = createCompletedRow(_source);
        tbody.appendChild(row);
      });
    }

    function createCompletedRow(source) {
      const {
        vendor, model, version, file_hash, file_name, status,
        ext_name, exc_line, exc_type, exc_value, exc_traceback,
        is_auto_uploaded, other, timestamp,
        comments  // ===== НОВОЕ: получаем comments =====
      } = source;

      const tr = document.createElement('tr');
      tr.className = status ? 'status-success' : 'status-failed';
      tr.dataset.dagId = file_hash;

      if (selectedDags.has(file_hash)) tr.classList.add('selected');

      // Details
      let detailsHtml = '';
      if (status === true && ext_name) {
        detailsHtml = `<span class="details-success">${escapeHtml(ext_name)}</span>`;
      } else if (status === false && exc_type) {
        detailsHtml = `
          <span class="details-failed error-trigger" 
                data-exc-line="${escapeHtml(exc_line || '')}"
                data-exc-type="${escapeHtml(exc_type || '')}"
                data-exc-value="${escapeHtml(exc_value || '')}"
                data-exc-traceback="${escapeHtml(exc_traceback || '')}">
            <i class="bi bi-exclamation-triangle-fill me-1"></i>${escapeHtml(exc_type)}
          </span>
        `;
      } else if (status === false) {
        detailsHtml = `<span class="details-failed"><i class="bi bi-question-circle me-1"></i>Ошибка без деталей</span>`;
      } else {
        detailsHtml = `<span class="empty-value">—</span>`;
      }

      // ===== НОВОЕ: Архитектура =====
      const architectureHtml = renderArchitectureCell(source);

      // Flags
      let flagsHtml = '';
      if (is_auto_uploaded === true) {
        flagsHtml += `<span class="flag-icon auto" title="Автоматически"><i class="bi bi-robot"></i></span>`;
      } else if (is_auto_uploaded === false) {
        flagsHtml += `<span class="flag-icon manual" title="Вручную"><i class="bi bi-hand-index"></i></span>`;
      }
      if (other) {
        flagsHtml += `<span class="flag-icon other" title="Дополнительно" onclick="event.stopPropagation(); openOtherModal('${file_hash}')"><i class="bi bi-file-earmark-code"></i></span>`;
      }
      // ===== НОВОЕ: Иконка comments =====
      if (comments) {
        flagsHtml += `<span class="flag-icon comments comment-trigger" 
                             title="Есть комментарий"
                             data-comment="${escapeHtml(comments)}">
                        <i class="bi bi-chat-left-text-fill"></i>
                      </span>`;
      }

      tr.innerHTML = `
        <td><input type="checkbox" class="form-check-input row-checkbox" ${selectedDags.has(file_hash) ? 'checked' : ''}></td>
        <td>${escapeHtml(vendor || '—')}</td>
        <td>${escapeHtml(model || '—')}</td>
        <td>${escapeHtml(version || '—')}</td>
        <!-- ===== НОВОЕ: ячейка архитектуры ===== -->
        <td class="architecture-cell">${architectureHtml}</td>
        <td><div class="file-name-cell" title="${escapeHtml(file_name || '')}">${escapeHtml(file_name || '—')}</div></td>
        <td class="details-cell">${detailsHtml}</td>
        <td><div class="flags-cell">${flagsHtml || '<span class="empty-value">—</span>'}</div></td>
        <td><span class="time-cell">${formatDateTime(timestamp)}</span></td>
      `;

      tr._sourceData = source;
      return tr;
    }

    // ================================================================
    // ===== ВЫБОР =====
    // ================================================================
    function initCompletedTableListeners() {
      const tbody = document.getElementById('completed-tbody');

      tbody.addEventListener('click', (e) => {
        const tr = e.target.closest('tr');
        if (!tr || !tr._sourceData) return;

        const fileHash = tr._sourceData.file_hash;

        if (e.target.classList.contains('row-checkbox')) {
          e.stopPropagation();
          const isChecked = e.target.checked;
          if (isChecked) {
            selectedDags.add(fileHash);
          } else {
            selectedDags.delete(fileHash);
          }
          toggleSelectionMode();
          updateRowSelection(fileHash);
          return;
        }

        if (e.target.closest('.flag-icon.other')) {
          e.stopPropagation();
          return;
        }

        console.log('Переход на /tasks/' + fileHash);
        // window.location.href = `/tasks/${fileHash}`;
      });

      document.getElementById('selectAllHeader').addEventListener('change', (e) => {
        if (e.target.checked) selectAllDags(); else clearSelection();
      });
    }

    function selectAllDags() {
      document.querySelectorAll('#completed-tbody tr[data-dag-id]').forEach(row => {
        selectedDags.add(row.dataset.dagId);
        updateRowSelection(row.dataset.dagId);
      });
      toggleSelectionMode();
    }

    function clearSelection() {
      selectedDags.clear();
      document.querySelectorAll('#completed-tbody tr[data-dag-id]').forEach(row => {
        row.classList.remove('selected');
        const cb = row.querySelector('.row-checkbox');
        if (cb) cb.checked = false;
      });
      document.getElementById('selectAllHeader').checked = false;
      toggleSelectionMode();
    }

    function updateRowSelection(dagId) {
      const row = document.querySelector(`#completed-tbody tr[data-dag-id="${dagId}"]`);
      if (row) {
        const isSel = selectedDags.has(dagId);
        row.classList.toggle('selected', isSel);
        const cb = row.querySelector('.row-checkbox');
        if (cb) cb.checked = isSel;
      }
    }

    function toggleSelectionMode() {
      const isSel = selectedDags.size > 0;
      document.getElementById('selectionControls').classList.toggle('show', isSel);
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const count = selectedDags.size;
      document.getElementById('selectedCount').textContent = `${count} объектов выбрано`;
      const allRows = document.querySelectorAll('#completed-tbody tr[data-dag-id]');
      const allChecked = count > 0 && count === allRows.length;
      document.getElementById('selectAllHeader').checked = allChecked;
      document.getElementById('selectAllCheckbox').checked = allChecked;
    }

    // ================================================================
    // ===== МОДАЛКА OTHER =====
    // ================================================================
    function openOtherModal(fileHash) {
      const row = document.querySelector(`#completed-tbody tr[data-dag-id="${fileHash}"]`);
      if (!row || !row._sourceData || !row._sourceData.other) return;

      let formatted;
      try {
        const parsed = typeof row._sourceData.other === 'string' ? JSON.parse(row._sourceData.other) : row._sourceData.other;
        formatted = JSON.stringify(parsed, null, 2);
      } catch {
        formatted = row._sourceData.other;
      }

      currentOtherJson = formatted;
      document.getElementById('otherJsonContent').textContent = formatted;

      new bootstrap.Modal(document.getElementById('otherModal')).show();
    }

    function copyOtherJson() {
      if (!currentOtherJson) return;
      navigator.clipboard.writeText(currentOtherJson).then(() => {
        const btn = document.getElementById('copyJsonBtn');
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="bi bi-check me-1"></i>Скопировано!';
        btn.classList.add('btn-success');
        setTimeout(() => {
          btn.innerHTML = orig;
          btn.classList.remove('btn-success');
        }, 1500);
      });
    }

    // ================================================================
    // ===== TOOLTIP (расширенный) =====
    // ===== ИЗМЕНЕНО: добавлена поддержка tooltip'а архитектуры и comments
    // ================================================================
    function initErrorTooltip() {
      let tooltipEl = document.getElementById('errorTooltip');
      if (!tooltipEl) {
        tooltipEl = document.createElement('div');
        tooltipEl.id = 'errorTooltip';
        tooltipEl.className = 'error-tooltip';
        document.body.appendChild(tooltipEl);
      }

      function cancelHide() {
        if (tooltipHideTimeout) {
          clearTimeout(tooltipHideTimeout);
          tooltipHideTimeout = null;
        }
      }

      function scheduleHide() {
        cancelHide();
        tooltipHideTimeout = setTimeout(() => {
          tooltipEl.classList.remove('show');
        }, 300);
      }

      tooltipEl.addEventListener('mouseenter', cancelHide);
      tooltipEl.addEventListener('mouseleave', scheduleHide);

      document.addEventListener('mouseover', (e) => {
        const onTooltip = e.target.closest('.error-tooltip');
        if (onTooltip) {
          cancelHide();
          return;
        }

        // ===== НОВОЕ: Архитектура =====
        const archTrigger = e.target.closest('.architecture-trigger');
        if (archTrigger) {
          cancelHide();

          const likely = archTrigger.dataset.archLikely || '';
          const scores = archTrigger.dataset.archScores || '';
          const socHitsStr = archTrigger.dataset.archSocHits || '[]';

          let socHits = [];
          try {
            socHits = JSON.parse(socHitsStr);
          } catch { socHits = []; }

          let html = '';
          if (likely) {
            html += `<div class="tooltip-row"><div class="tooltip-label">Выявленная архитектура</div><div class="tooltip-value">${escapeHtml(likely)}</div></div>`;
          }
          if (scores) {
            html += `<div class="tooltip-row"><div class="tooltip-label">Scores</div><div class="tooltip-value">${escapeHtml(scores)}</div></div>`;
          }
          if (socHits.length > 0) {
            const tags = socHits.map(h => `<span class="tooltip-tag">${escapeHtml(h)}</span>`).join('');
            html += `<div class="tooltip-row"><div class="tooltip-label">SoC Hits</div><div class="tooltip-scores-list">${tags}</div></div>`;
          }

          tooltipEl.innerHTML = html;
          tooltipEl.classList.add('show');

          const rect = archTrigger.getBoundingClientRect();
          tooltipEl.style.left = Math.min(rect.left, window.innerWidth - 520) + 'px';
          tooltipEl.style.top = (rect.bottom + 8) + 'px';

          const tRect = tooltipEl.getBoundingClientRect();
          if (tRect.bottom > window.innerHeight) {
            tooltipEl.style.top = (rect.top - tRect.height - 8) + 'px';
          }
          return;
        }

        // ===== НОВОЕ: Comments =====
        const commentTrigger = e.target.closest('.comment-trigger');
        if (commentTrigger) {
          cancelHide();

          const comment = commentTrigger.dataset.comment || '';

          tooltipEl.innerHTML = `
            <div class="tooltip-row">
              <div class="tooltip-label">Комментарий</div>
              <div class="tooltip-value" style="color: #d4d4d4;">${escapeHtml(comment)}</div>
            </div>
          `;
          tooltipEl.classList.add('show');

          const rect = commentTrigger.getBoundingClientRect();
          tooltipEl.style.left = Math.min(rect.left, window.innerWidth - 520) + 'px';
          tooltipEl.style.top = (rect.bottom + 8) + 'px';

          const tRect = tooltipEl.getBoundingClientRect();
          if (tRect.bottom > window.innerHeight) {
            tooltipEl.style.top = (rect.top - tRect.height - 8) + 'px';
          }
          return;
        }

        // ===== Старое: ошибки =====
        const trigger = e.target.closest('.error-trigger');
        if (!trigger) return;

        cancelHide();

        const excType = trigger.dataset.excType;
        const excLine = trigger.dataset.excLine;
        const excValue = trigger.dataset.excValue;
        const excTraceback = trigger.dataset.excTraceback;

        let html = '';
        if (excType) html += `<div class="tooltip-row"><div class="tooltip-label">Type</div><div class="tooltip-value">${escapeHtml(excType)}</div></div>`;
        if (excLine) html += `<div class="tooltip-row"><div class="tooltip-label">Line</div><div class="tooltip-value">${escapeHtml(excLine)}</div></div>`;
        if (excValue) html += `<div class="tooltip-row"><div class="tooltip-label">Value</div><div class="tooltip-value">${escapeHtml(excValue)}</div></div>`;
        if (excTraceback) html += `<div class="tooltip-row"><div class="tooltip-label">Traceback</div><div class="tooltip-value traceback">${escapeHtml(excTraceback)}</div></div>`;

        tooltipEl.innerHTML = html;
        tooltipEl.classList.add('show');

        const rect = trigger.getBoundingClientRect();
        tooltipEl.style.left = Math.min(rect.left, window.innerWidth - 520) + 'px';
        tooltipEl.style.top = (rect.bottom + 8) + 'px';

        const tRect = tooltipEl.getBoundingClientRect();
        if (tRect.bottom > window.innerHeight) {
          tooltipEl.style.top = (rect.top - tRect.height - 8) + 'px';
        }
      });

      document.addEventListener('mouseout', (e) => {
        const onTrigger = e.target.closest('.error-trigger, .architecture-trigger, .comment-trigger');
        const onTooltip = e.target.closest('.error-tooltip');

        if (onTrigger || onTooltip) {
          scheduleHide();
        }
      });

      window.addEventListener('scroll', () => {
        cancelHide();
        tooltipEl.classList.remove('show');
      }, true);
    }

    // ================================================================
    // ===== ИНИЦИАЛИЗАЦИЯ =====
    // ================================================================
    document.addEventListener('DOMContentLoaded', () => {
      initCompletedTableListeners();
      initErrorTooltip();

      document.getElementById('selectAllCheckbox').addEventListener('change', (e) => {
        if (e.target.checked) selectAllDags(); else clearSelection();
      });

      document.getElementById('deleteSelectedBtn').addEventListener('click', () => {
        if (selectedDags.size === 0) return;
        if (confirm(`Удалить ${selectedDags.size} объектов?`)) {
          alert(`Удаление ${selectedDags.size} объектов (мок)`);
          clearSelection();
        }
      });

      document.getElementById('clearSelectionBtn').addEventListener('click', clearSelection);
      document.getElementById('copyJsonBtn').addEventListener('click', copyOtherJson);

      renderCompletedTasks(MOCK_COMPLETED_DATA, true);
    });

    window.openOtherModal = openOtherModal;
  </script>
</body>
</html>
